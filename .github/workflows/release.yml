name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Keep committed lib/ in sync with source
        run: git diff --exit-code -- lib
      - run: pnpm test
      - run: pnpm pack --pack-destination .
      - name: Stable tarball name for GitHub Releases
        run: |
          version="$(node -p 'require("./package.json").version')"
          cp "dsh-user-experience-${version}.tgz" dsh-user-experience.tgz
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dsh-user-experience.tgz
            dsh-user-experience-*.tgz
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: pnpm publish --access public --no-git-checks
